# Pid file in /tmp because the non-root user can't write to /run
pid /tmp/nginx.pid;
# Let nginx pick one worker per CPU core
worker_processes auto;
# Send error logs to the container's stderr so `docker compose logs` shows them
error_log /dev/stderr warn;

# Connection-handling settings
events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

# All HTTP settings live here
http {
    # Map file extensions to Content-Type headers
    include /etc/nginx/mime.types;
    # Fallback type for unknown extensions
    default_type application/octet-stream;
    # Send access logs to the container's stdout
    access_log /dev/stdout;

    # Temp dirs must be writable by the non-root user, so point them at /tmp
    client_body_temp_path /tmp/client_temp;
    # Temp dir for buffered upstream responses
    proxy_temp_path /tmp/proxy_temp;
    # Required by the image even if unused
    fastcgi_temp_path /tmp/fastcgi_temp;
    # Required by the image even if unused
    uwsgi_temp_path /tmp/uwsgi_temp;
    # Required by the image even if unused
    scgi_temp_path /tmp/scgi_temp;

    # Frontend upstream: service name + CONTAINER port (not the host port 5173)
    upstream react_frontend {
        # Docker DNS resolves "frontend" because both share frontend_app
        server frontend:8080;
        # Reuse upstream connections
        keepalive 32;
    }

    # API upstream: the compose service is "api", not "rust_api"
    upstream rust_api {
        # Docker DNS resolves "api" because both share backend
        server api:8181;
        # Reuse upstream connections
        keepalive 32;
    }

    # One virtual host
    server {
        # Unprivileged nginx can't bind port 80; compose maps host 80 -> 8080
        listen 8080;

        # Requests starting with /api/ go to the Rust API
        location /api/ {
            # Forward to the API upstream (keeps the /api/ prefix; change if your API doesn't expect it)
            proxy_pass http://rust_api;
            # Needed for keepalive to the upstream
            proxy_http_version 1.1;
            # Clear the Connection header so keepalive works
            proxy_set_header Connection "";
            # Pass the original Host header
            proxy_set_header Host $host;
            # Pass the real client IP
            proxy_set_header X-Real-IP $remote_addr;
            # Pass the original scheme (http/https)
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else goes to the React frontend
        # Auth routes go to the Rust API (prefix kept, the API serves /auth/...)
        location /auth/ {
            # Forward to the API upstream
            proxy_pass http://rust_api;
            # Needed for keepalive to the upstream
            proxy_http_version 1.1;
            # Clear the Connection header so keepalive works
            proxy_set_header Connection "";
            # Pass the original Host header
            proxy_set_header Host $host;
            # Pass the real client IP
            proxy_set_header X-Real-IP $remote_addr;
            # Pass the original scheme (http/https)
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # Forward to the frontend upstream
            proxy_pass http://react_frontend;
            # Needed for keepalive to the upstream
            proxy_http_version 1.1;
            # Clear the Connection header so keepalive works
            proxy_set_header Connection "";
            # Pass the original Host header
            proxy_set_header Host $host;
            # Pass the real client IP
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
