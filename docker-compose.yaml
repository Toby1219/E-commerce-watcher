services:
  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8181:8181"
    networks:
      - backend
      - frontend_app

  internal_api:
    build:
      context: ./services
    environment:
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    env_file:
      - ./services/crawlers/.env
    volumes:
      - hf_cache:/models/hf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 5173:8080
    networks:
      - frontend_app

  nginx_proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro # Mounts host SSL certificates into container
    depends_on:
      - frontend
      - api
    networks:
      - backend       
      - frontend_app

  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - redis-data:/data
    networks:
      - backend

volumes:
  pgdata:
  redis-data:
  hf_cache:

networks:
  backend:
    driver: bridge
  frontend_app:
    driver: bridge
