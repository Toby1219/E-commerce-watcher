[package]
name = "api"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".", 
    "entities",
    "migration",
]

[lib]
name = "api"
path = "src/lib.rs"

[dependencies]
chrono = "^0.4"
futures-util = "0.3" 
actix-web = "4"
actix-rt = "2.15.0"
actix-cors = "0.7.1"
actix-governor = "0.10"
actix-http = "3"
anyhow = "1.0.104"
serde = {version="1.0", features=["derive"]}
serde_json = "1"
sea-orm = { version = "2.0.3", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "postgres-vector"] }
sea-orm-migration = "2.0.3"
validator = { version = "0.21.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
sha256 ="1.5.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"]}
regex = "1.13.1"
argon2 = "0.5.3"
uuid = { version = "1", features = ["v4", "serde"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.10.2"
sha2 = "^0.11"
hex = "0.4.3"

redis = { version ="1.7.0", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rust_decimal = "1.43.0"

entities = { path = "./entities" }
migration = { path = "./migration" }
utoipa = { version = "6.0.0", features = ["actix_extras", "chrono", "preserve_path_order", "decimal"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["actix-web"] }
utoipa-actix-web = "0.2.0"
reqwest = { version = "0.13.5", features = ["json"] }
