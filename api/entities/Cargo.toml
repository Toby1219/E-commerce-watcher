[package]
name = "entities"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "with-json",
    "with-chrono",
    "postgres-vector"
] }
sea-orm-migration = "2.0.1"
sea-orm-cli = "2.0.2"

chrono = "^0.4"
serde = {version="1.0", features=["derive"]}
serde_json = "1"